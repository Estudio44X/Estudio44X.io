<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Never The Same Fear — un juego de terror y comedia donde cada partida te hace dudar de lo que viste.">
    <meta name="theme-color" content="#08090b">
    <title>Never The Same Fear</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Never The Same Fear, inicio">
        <img src="brand-mark.png" alt="Logotipo Never The Same Fear">
        <span>NEVER THE SAME FEAR</span>
      </a>
      <nav aria-label="Navegación principal">
        <a href="#el-juego">El juego</a>
        <a href="#comunidad">Comunidad</a>
        <a href="privacy.html">Privacidad</a>
      </nav>
    </header>

    <main id="contenido">
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <div class="hero-media" aria-hidden="true"></div>
        <div class="hero-noise" aria-hidden="true"></div>
        <div class="hero-content container">
          <p class="eyebrow"><span></span> TERROR · COMEDIA · MULTIJUGADOR</p>
          <img class="hero-logo" src="game-logo.png" alt="Never The Same Fear">
          <h1 id="hero-title">No todos volverán a ver la misma noche.</h1>
          <p class="hero-copy">Reúne a tus amigos, entra al pueblo y sobrevive a una experiencia donde el miedo cambia de forma cuando menos lo esperas.</p>
          <div class="hero-actions">
            <a class="button button-primary" href="#comunidad">Sigue el proyecto <span aria-hidden="true">↗</span></a>
            <a class="button button-ghost" href="#el-juego">Descubre más</a>
          </div>
        </div>
        <div class="scroll-cue" aria-hidden="true"><span></span> DESCIENDE</div>
      </section>

      <section class="manifesto section container" id="el-juego">
        <p class="section-label">EL JUEGO</p>
        <div class="manifesto-grid">
          <h2>El miedo no avisa. Solo cambia las reglas.</h2>
          <div>
            <p>Never The Same Fear combina terror atmosférico, humor oscuro y caos cooperativo. Cada sesión es una invitación a explorar, gritar y reír con tus amigos.</p>
            <p>Entra con un plan. Sal con una historia que nadie creerá igual.</p>
          </div>
        </div>
      </section>

      <section class="features section" aria-label="Características">
        <div class="container feature-grid">
          <article>
            <span class="feature-number">01</span>
            <h3>Terror compartido</h3>
            <p>Explora con tus amigos y convierte cada silencio en una sospecha.</p>
          </article>
          <article>
            <span class="feature-number">02</span>
            <h3>Humor inesperado</h3>
            <p>El pánico es serio. Las situaciones absurdas no siempre lo son.</p>
          </article>
          <article>
            <span class="feature-number">03</span>
            <h3>Partidas únicas</h3>
            <p>Lo que ocurrió una vez quizá no suceda jamás de la misma manera.</p>
          </article>
        </div>
      </section>

      <section class="community section container" id="comunidad">
        <div>
          <p class="section-label">COMUNIDAD</p>
          <h2>La puerta está entreabierta.</h2>
          <p>¿Quieres enterarte de avances, pruebas y próximas novedades? Déjanos un mensaje.</p>
        </div>
        <form class="contact-form" name="contacto-never-the-same-fear" method="POST" data-netlify="true" action="/">
          <input type="hidden" name="form-name" value="contacto-never-the-same-fear">
          <label>
            Nombre
            <input name="nombre" type="text" autocomplete="name" required>
          </label>
          <label>
            Correo electrónico
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label>
            Mensaje
            <textarea name="mensaje" rows="4" required></textarea>
          </label>
          <button class="button button-primary" type="submit">Enviar mensaje <span aria-hidden="true">↗</span></button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year">2026</span> Never The Same Fear. Todos los derechos reservados.</p>
        <a href="privacy.html">Política de privacidad</a>
      </div>
    </footer>
  </body>
</html>
